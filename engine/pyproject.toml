[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vidigen-engine"
version = "0.1.0"
description = "Local beat-synced music video generator (engine for the Vidigen desktop app)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "imageio-ffmpeg>=0.5",
  "opencv-python-headless>=4.9",
  "pillow-heif>=0.18",
]

[project.optional-dependencies]
# GPU generation. The app's Setup screen installs these (and CUDA torch) for you.
ml = [
  "diffusers>=0.35",
  "transformers>=4.46",
  "accelerate>=1.0",
  "huggingface_hub>=0.26",
  "safetensors",
  "sentencepiece",
  "protobuf",
  "ftfy",
  "imageio[ffmpeg]",
]
dev = ["pytest>=8"]

[project.scripts]
vidigen-engine = "vidigen_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["vidigen_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
